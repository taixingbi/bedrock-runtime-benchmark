name: CI

# No live-Bedrock job here -- this repo's whole reason to exist is
# spending real time/money against real Bedrock capacity, which CI
# should never do on every push. Tests run entirely against
# tests/fakes.py's fake bedrock-runtime client -- no AWS credentials
# needed or used here.
#
# Python version policy -- one source each, no drift:
#   requires-python (pyproject.toml) = supported range -> the test matrix
#   .python-version                  = default dev interpreter -> pip-audit
# Dependencies always come from pyproject.toml (`pip install -e ".[dev]"`),
# the same command local dev uses -- never a hand-listed package set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify every experiment binds to every model
        run: |
          python -c "
          import glob
          from bedrock_benchmark.experiments.schema import load_experiment
          from bedrock_benchmark.models import load_models
          for model in load_models(include_disabled=True):
              for path in sorted(glob.glob('experiments/*.yaml')):
                  load_experiment(path, model)
                  print(f'ok: {model.name} x {path}')
          "

      # The public CLI: installed by `pip install -e .`, lists the catalog,
      # and plans every experiment for every enabled model -- no AWS calls.
      - name: bedrock-benchmark CLI
        run: |
          bedrock-benchmark list
          bedrock-benchmark plan all --all-models

      # The machine contract: the shipped JSON Schemas are themselves valid
      # (tests/test_cli.py checks engine output conforms to them).
      - name: Artifact schemas
        run: |
          python -c "
          import json, glob, jsonschema
          for p in glob.glob('src/bedrock_benchmark/schemas/*.json'):
              jsonschema.Draft202012Validator.check_schema(json.load(open(p)))
              print(f'ok: {p}')
          "

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        # setuptools upgraded explicitly: the runner's ambient pip/
        # setuptools (pulled in by actions/setup-python, not a
        # dependency this project declares) had a known CVE
        # (PYSEC-2026-3447) that isn't fixed by pinning anything in
        # pyproject.toml -- live-caught by this exact job failing on
        # the first real push, not guessed ahead of time.
        run: pip install --upgrade pip setuptools && pip install -e ".[dev]" pip-audit
      - name: pip-audit
        # --skip-editable: the project itself isn't on PyPI to audit;
        # its resolved dependencies are.
        run: pip-audit --desc --skip-editable
