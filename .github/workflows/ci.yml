name: CI

# No live-Bedrock job here -- this repo's whole reason to exist is
# spending real time/money against real Bedrock capacity, which CI
# should never do on every push. Tests run entirely against
# tests/fakes.py's fake bedrock-runtime client -- no AWS credentials
# needed or used here.
#
# Python version policy -- one source each, no drift:
#   requires-python (pyproject.toml) = supported range -> the test matrix
#   .python-version                  = default dev interpreter -> pip-audit
# Dependencies always come from pyproject.toml (`pip install -e ".[dev]"`),
# the same command local dev uses -- never a hand-listed package set.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project + dev dependencies
        run: pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Verify shipped experiment YAMLs still parse
        run: |
          python -c "
          from bedrock_benchmark.experiments.schema import load_experiment
          import glob
          for path in glob.glob('experiments/*.yaml'):
              load_experiment(path)
              print(f'ok: {path}')
          "

  pip-audit:
    name: Dependency scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dependencies
        # setuptools upgraded explicitly: the runner's ambient pip/
        # setuptools (pulled in by actions/setup-python, not a
        # dependency this project declares) had a known CVE
        # (PYSEC-2026-3447) that isn't fixed by pinning anything in
        # pyproject.toml -- live-caught by this exact job failing on
        # the first real push, not guessed ahead of time.
        run: pip install --upgrade pip setuptools && pip install -e ".[dev]" pip-audit
      - name: pip-audit
        # --skip-editable: the project itself isn't on PyPI to audit;
        # its resolved dependencies are.
        run: pip-audit --desc --skip-editable
