name: Bedrock benchmark

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Experiment name or YAML filename from experiments/
        type: string
        default: capacity-context-short-rate
        required: true
      model:
        description: Model name from the repository catalog
        type: string
        default: nova-micro
        required: true
      dry_run:
        description: Plan only, without AWS requests
        type: boolean
        default: true
      commit_results:
        description: Commit each live job's saved results to benchmark-results branch
        type: boolean
        default: true

permissions:
  contents: read

# Serialize live runs across this workflow, including different models.
concurrency:
  group: bedrock-history-benchmark
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare experiment jobs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    env:
      EXPERIMENT: ${{ inputs.experiment }}
      MODEL: ${{ inputs.model }}
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .
      - name: Build jobs from experiment
        id: matrix
        run: python scripts/actions_matrix.py
      - name: Validate experiment plan
        run: bedrock-benchmark plan "${EXPERIMENT%.yaml}" --model "$MODEL"

  benchmark:
    needs: prepare
    permissions:
      contents: write
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      MODEL: ${{ inputs.model }}
      EXPERIMENT_CONFIG: ${{ toJSON(matrix.config) }}
      PYTHONUNBUFFERED: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install benchmark
        run: pip install -e .
      - name: Prepare independent subset
        run: |
          mkdir -p results
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import yaml
          config = json.loads(os.environ['EXPERIMENT_CONFIG'])
          encoded = yaml.safe_dump(config, sort_keys=False)
          Path('results/experiment.yaml').write_text(encoded)
          Path('experiments/actions-selected.yaml').write_text(encoded)
          PY
          bedrock-benchmark plan actions-selected --model "$MODEL"
      - name: Authenticate to AWS
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - name: Run selected experiment
        if: ${{ !inputs.dry_run }}
        env:
          RUN_OWNER: ${{ github.actor }}
        run: |
          # Stop before the job timeout, leaving time to upload completed arms.
          timeout --signal=INT --kill-after=90s 270m \
            bedrock-benchmark run actions-selected --model "$MODEL" \
              --results-dir results --workload-rotation-index 0 \
              --owner "$RUN_OWNER" --purpose 'benchmark via GitHub Actions' \
              --ticket "actions-${GITHUB_RUN_ID}" --environment dev
      - name: Upload this subset and completed checkpoints
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
      - name: Commit this job's saved results to the repository
        if: ${{ always() && !inputs.dry_run && inputs.commit_results }}
        env:
          RESULTS_DIR: results
          RESULTS_JOB_ID: ${{ matrix.id }}
        run: python scripts/commit_actions_results.py
