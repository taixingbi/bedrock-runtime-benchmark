# SLO -- what quality we REQUIRE, as named profiles per workload /
# use case. Defined once and shared by every experiment and model, so
# the same class of traffic is always judged the same way.
#
# There is no implicit default: every workload in every experiment (and
# every class of a mixed workload) must name its profile explicitly --
#   workloads:
#     - {name: long_long, input_tokens: 4096, output_tokens: 512, slo_profile: long_generation}
# TTFT can be shared, but a 512-token generation can't meet a 64-token
# reply's end-to-end budget, hence separate profiles.
#
#   ttft_p95_ms        time to first token, p95 (streaming only)
#   latency_p95_ms     end-to-end latency, p95
#   success_rate_min   fraction of requests that must succeed
#   throttle_rate_max  max fraction throttled (429)
#   confidence         optional, e.g. 0.95: gate success/throttle on
#                      Wilson bounds instead of point estimates -- needs
#                      ~2,700 requests per point to resolve 0.1%

profiles:
  # Chat-style replies: short output, user waiting on the full answer.
  interactive:
    ttft_p95_ms: 1000
    latency_p95_ms: 3000
    success_rate_min: 0.99
    throttle_rate_max: 0.001

  # Long generations (~512 output tokens): same first-token promise,
  # longer end-to-end budget.
  long_generation:
    ttft_p95_ms: 1000
    latency_p95_ms: 10000
    success_rate_min: 0.99
    throttle_rate_max: 0.001
