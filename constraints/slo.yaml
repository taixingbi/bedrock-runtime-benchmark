# SLO -- what quality we REQUIRE, as named profiles. Kept separate from
# workloads: catalog/workloads.yaml binds each workload to one of these
# profiles explicitly (no default), and experiments only list workloads.
# The same model serves every profile, so each profile yields its own
# safe envelope per model -- a gateway's request_class -> limits.
#
# Three service classes, by business criticality of the request -- not
# by model:
#
# Gated on the two latency components rather than end-to-end latency,
# so one class stays meaningful whatever the output length:
#
#   ttft_p95_ms        time to first token, p95 (streaming only)
#   tpot_p95_ms        time per output token after the first, p95:
#                      (latency - TTFT) / (output_tokens - 1)
#   latency_p95_ms     optional end-to-end latency, p95
#   success_rate_min   fraction of requests that must succeed
#   throttle_rate_max  max fraction throttled (429)
#   confidence         optional, e.g. 0.95: gate success/throttle on
#                      Wilson bounds instead of point estimates. Requests
#                      per point needed to resolve throttle_rate_max at
#                      95%: ~2,700 (0.001), ~540 (0.005), ~270 (0.01)

profiles:
  gold:
    # Real-time, latency-sensitive, business-critical workloads.
    ttft_p95_ms: 800
    tpot_p95_ms: 40
    success_rate_min: 0.995
    throttle_rate_max: 0.001

  silver:
    # Standard synchronous application workloads.
    ttft_p95_ms: 1500
    tpot_p95_ms: 70
    success_rate_min: 0.99
    throttle_rate_max: 0.005

  bronze:
    # Async, batch, or throughput-oriented workloads.
    ttft_p95_ms: 3000
    tpot_p95_ms: 120
    success_rate_min: 0.99
    throttle_rate_max: 0.01
