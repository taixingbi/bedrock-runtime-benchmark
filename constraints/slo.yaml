# TTFT budgets follow configured input length; TPOT and reliability are
# selected independently through each workload's slo_profile.
# These are policy budgets, not fitted provider performance or quota windows.
#
# Bands have inclusive upper bounds, in ascending order. The last is unbounded.
# Selection uses the workload's declared input_tokens before calibration/load;
# observed token counts must still pass workload validation. Crossing a band
# due to sampling/calibration variation does not change a request's SLO.
# Initial boundaries and budgets are configurable choices, not measured knees.
#
# ttft_p95_ms: SDK invocation to first non-empty streamed text, p95.
# tpot_p95_ms: (latency - TTFT) / (output_tokens - 1), p95.
# E2E budgets remain workload-specific in catalog/workloads.yaml.
# Latency gates test threshold exceedances with exact confidence bounds;
# the new TTFT selection rule does not change the statistical tests.
# Profile names below select output-speed and reliability budgets only.

ttft_budgets:
  short_input:
    max_input_tokens: 512
    ttft_p95_ms: 800
  medium_input:
    max_input_tokens: 4096
    ttft_p95_ms: 1500
  long_input:
    max_input_tokens: null
    ttft_p95_ms: 3000

profiles:
  gold:
    # TPOT p95 <= 40 ms/output token.
    # Success >= 99.5%; throttling <= 0.1%.
    tpot_p95_ms: 40
    success_rate_min: 0.995
    throttle_rate_max: 0.001
    confidence: 0.95

  silver:
    # TPOT p95 <= 70 ms/output token.
    # Success >= 99%; throttling <= 0.5%.
    tpot_p95_ms: 70
    success_rate_min: 0.99
    throttle_rate_max: 0.005
    confidence: 0.95

  bronze:
    # TPOT p95 <= 120 ms/output token.
    # Success >= 99%; throttling <= 1%.
    tpot_p95_ms: 120
    success_rate_min: 0.99
    throttle_rate_max: 0.01
    confidence: 0.95
