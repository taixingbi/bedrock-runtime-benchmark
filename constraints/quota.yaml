# Quota -- what capacity the PROVIDER ALLOWS. Bedrock quotas are per
# AWS account, per region, per model, so this file is scoped the same
# way:
#
#   accounts:
#     <account id>:
#       <region>:
#         <model name from scripts/models.yaml>: {rpm, tpm[, output_burndown]}
#
#   rpm              requests per minute
#   tpm              tokens per minute (input + max_tokens x output_burndown)
#   output_burndown  TPM tokens charged per output token (default 1)
#
# At run time the account comes from the live AWS credentials (STS) and
# the region from each model's entry in scripts/models.yaml; a run on an
# account with no entry here fails instead of sweeping around someone
# else's quota. Quota-relative rate sweeps are fractions of the ceiling
# min(RPM/60, TPM / tokens-per-request / 60).
#
# Snapshot, not enforced by this repo -- check against AWS with:
#   .venv/bin/python scripts/fetch_quota.py --all
# Values from gateway-model-quotas-dev, fetched 2026-09-25.

accounts:
  "646821141010":
    us-east-1:
      nova-micro:   {rpm: 400,  tpm: 8000000}
      nova-lite:    {rpm: 400,  tpm: 8000000}
      nova-pro:     {rpm: 50,   tpm: 2000000}
      llama3-3-70b: {rpm: 80,   tpm: 600000}
      qwen3-32b:    {rpm: 1000, tpm: 100000000}
