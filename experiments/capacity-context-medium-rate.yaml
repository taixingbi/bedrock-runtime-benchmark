# Experiment A: run each class separately on a quiet quota.
purpose: admission_calibration
name: capacity-context-medium-rate
description: 'Experiment A: confirm the medium input class baseline at output=64.
  R_safe_idle is the independently confirmed offered rate under this SLO and provider
  state; fixed idle alone does not prove reset.'
workloads:
- medium
warmup_s: 0
duration_s: 900
stream: true
sweep:
  type: rate
  values:
  - 0.5
  - 1
  - 1.5
  - 2
  stop_after_clear_fail: true
confirmation:
  max_looks: 2
  max_requests: auto
  max_duration_s: auto
  candidates: 3
  cooldown_s: 300
  warmup_s: 0
  min_steady_state_duration_s: 900
  continuous: true
isolation:
  inter_subject_cooldown_s: 120
  recovery_probe:
    duration_s: 20
    concurrency: 1
    max_throttle_rate: 0.0
    min_success_rate: 0.99
    max_ttft_ratio: 2.0
    max_attempts: 5
    retry_cooldown_s: 120
    baseline_fraction: 0.25
    baseline_duration_s: 120
    baseline_min_requests: 100
    baseline_goodput_ratio: 0.9
transport:
  max_connections: 128
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
seed: 7
