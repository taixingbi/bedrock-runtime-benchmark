# Admission calibration: the statistically confirmed safe concurrency of
# each workload SHAPE under its real business SLO, the quota and the
# measured provider environment --
#   C_safe = f(input/output tokens, SLO, quota, provider conditions)
# -- for the four catalog shapes that aren't reference workloads, each
# concurrency-swept on its own:
#   tiny_request               256 / 32     gold    low-token latency floor
#   medium_context             2048 / 128   silver  common app traffic
#   long_context_short_answer  8192 / 64    silver  input-side (prefill) pressure
#   very_large_context         16384 / 256  bronze  large prefill
# long_generation (4096 / 1024, bronze, 60000ms) is also measured as a
# reference_control to compare decode-heavy behavior with large prefill.
# It produces evidence only here; its production envelopes still come
# from concurrency-sweep and rate-capacity.
#
# Output per shape: a `calibration_point` (confirmed concurrency,
# confirmed_rates -- attempted / successful / throttled / goodput rps --
# ceiling_ratio, saturation edge, bottleneck). The rates are what C and
# latency produced in this closed-loop run -- observations, not a tested
# rate envelope (that's rate-capacity's sustained_rps):
#
#   calibration_point -> workload-specific admission evidence
#          -> policy derivation (gateway) -> mixed validation (eval-bedrock-platform)
#
# Different workload shapes may require different concurrency to reach
# the same provider rate ceiling; therefore concurrency must not be
# interpreted as a workload cost weight.
#
# It is NOT a production config: no admission envelope, no headroom.
# Calibration points are isolated-workload measurements; per-shape
# C_safe values don't combine mathematically into a global policy. Any
# policy derived from them must be validated under
# representative mixed traffic through the deployed gateway
# (eval-bedrock-platform) before production use -- this repo calls
# Bedrock directly and never validates gateway policy.
#
# Each shape keeps its own business SLO (catalog/workloads.yaml) -- the
# gateway needs C_safe under the SLO it will actually enforce, not a
# shape-only comparison under one fixed SLO.
#
# The RPM ceiling is reached at different concurrency levels because
# request service time varies by workload shape. The sweep therefore
# spans 1..48; stop_after_fails and refinement locate the local boundary
# without unnecessarily continuing deep into overload. Slow: run it for a
# capacity re-baseline, not on every change.
#
# Research limit: on nova-micro (400 RPM) every shape hits the RPM quota
# long before any token or compute limit, so C_safe here is ~ 6.67 rps x
# request service time -- the workload shape primarily affects the
# observed concurrency boundary through request service time while RPM
# remains the binding provider constraint.
# Isolating how input / output tokens themselves limit capacity needs an
# account or model whose RPM quota doesn't bind first.
purpose: admission_calibration
name: workload-shape-calibration
description: |
  Concurrency 1..48 (until two consecutive FAILs, then integer
  refinement and fixed-count plus minimum-time confirmation) across the four non-reference
  catalog shapes plus long_generation as a reference control, each under
  its own SLO. Produces statistically
  confirmed workload-shape capacity points -- workload-specific
  admission evidence for gateway policy derivation, not a production
  config.

workloads: [tiny_request, medium_context, long_context_short_answer, very_large_context, long_generation]

# Experiment-local role; shape and SLO remain defined in catalog/workloads.yaml.
workload_roles:
  long_generation: reference_control

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8, 12, 16, 24, 32, 48]
  stop_after_fails: 2
  refinement:            # bisect the bracket around saturation (see concurrency-sweep.yaml)
    strategy: integer_bisection
    stop_when_adjacent: true
    max_points: 4
    cooldown_s: 120      # recovery interval before EACH refinement point

# Provider-state isolation: a fixed recovery interval is inserted to
# reduce carry-over from preceding overload, so each result approximates
# C_safe(W_i) rather than C_safe(W_i | the overload just before it). All
# shapes share one model's quota, so the next shape waits after the
# previous one's overload; confirmation.cooldown_s below does the same
# before EVERY candidate, including a lower one after a higher one FAILed.
# 120 s is a recovery policy, not a proven reset -- provider state isn't
# observable.
isolation:
  inter_subject_cooldown_s: 120
  # Recovery is CHECKED, not assumed: after each recovery interval a short
  # low-load probe (data discarded) must be healthy -- no throttling,
  # >= 90% success, TTFT p50 within 2x the first healthy probe -- before
  # the next phase; unhealthy -> wait retry_cooldown_s and probe again, up
  # to max_attempts; never healthy -> measurement_validity: invalid.
  # Points throttled far below the ceiling are discarded, recovered and
  # re-measured once (provider state, not the point's own load).
  recovery_probe:
    duration_s: 20
    concurrency: 1
    max_throttle_rate: 0.0
    min_success_rate: 0.9
    max_ttft_ratio: 2.0
    max_attempts: 5
    retry_cooldown_s: 120

# Confirmation at each shape's candidates (fresh data, never pooled with
# discovery -- see docs/slo-statistics.md). Looks at fixed sample sizes;
# with 2 candidates, alpha is split across candidates x looks:
#   gold N = 4,380 / 6,379, silver N = 875 / 1,274, bronze N = 437 / 636
# stopped by max_requests / max_duration_s, never by a count of windows.
# (With a single eligible candidate the looks are the unsplit
# 3,688 / 5,570, 736 / 1,113, 368 / 555.)
#
# Design (the runs behind it: docs/correctness-history.md):
#   - C_safe is decided by confirmation, not by a heuristic filter: the
#     provider ceiling (ceiling_ratio = served / nominal ceiling; > 1.10
#     suggests burst) bounds the refinement bracket and sets candidate
#     PRIORITY -- if both candidates are above it, the lower is swapped
#     for the highest point at or below it -- but never rejects one. A
#     point confirmed above the ceiling is flagged
#     confirmed_above_provider_ceiling (it held for the confirmation
#     window, not indefinitely);
#   - every tested candidate: cooldown_s (overload from discovery or a
#     higher candidate clears) -> warmup_s of conditioning (data
#     discarded, so the fixed-N looks read steady state, not a rested
#     bucket's burst credit) -> the looks;
#   - a fixed-count PASS also needs minimum measured exposure and clean
#     collected-data sanity checks; later violations veto confirmation;
#   - candidates: 2 -- tested highest first, stop at the first confirmed PASS; if
#     the higher one FAILs, the lower one can still confirm. alpha is split
#     over both; max_duration_s 3000 (cooldown and conditioning not
#     counted) fits the higher FAILing and a slow lower gold candidate
#     (~2 rps) collecting 4,380.
confirmation:
  # Observation policy, not an assumed Bedrock quota/reset window.
  # Only measured load time counts; a sample-count PASS alone is insufficient.
  min_steady_state_duration_s: 300
  max_looks: 2
  max_requests: 8000
  max_duration_s: 3000
  candidates: 2
  cooldown_s: 120
  warmup_s: 60

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
