# nova-pro's real quota is dramatically tighter than nova-micro/lite's
# (400 RPM) -- and its real per-call latency makes that binding in a
# way concurrency-sweep.yaml's [1,2,4,6,8] pattern was never designed
# for.
#
# Live-checked (scripts/fetch_quota.py --model-id us.amazon.nova-pro-v1:0):
#   50 RPM = 0.83 rps, 2,000,000 TPM
# Live-measured (a 1-request smoke check at concurrency=1, closed-loop):
#   TTFT ~612ms, e2e latency ~616ms -> closed-loop rate at just C=1 is
#   already ~1.6 rps -- ~2x OVER the real RPM ceiling. A concurrency
#   sweep starting at 1 would already be in throttle territory before
#   it even started sweeping; this model's real latency profile makes
#   RATE (not concurrency) the only sweep dimension that can actually
#   resolve where the safe zone is, which is why this is a `rate` sweep
#   with sub-1 fractional values, not a `concurrency` sweep.
name: nova-pro-rate-capacity
description: |
  Rate sweep bracketing the real ~0.83 rps RPM ceiling with fractional
  values below 1 -- a [1,2,4,...] concurrency sweep can't resolve this
  model's actual safe zone, since even C=1 closed-loop already runs
  ~2x over quota. 120s per point (7 points ~= 14 minutes total).

target:
  model_id: us.amazon.nova-pro-v1:0
  region: us-east-1

quota_snapshot:
  rpm: 50
  tpm: 2000000

slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

workloads:
  - name: short
    input_tokens: 512
    output_tokens: 64

duration_s: 120
stream: true

sweep:
  type: rate
  values: [0.2, 0.4, 0.6, 0.8, 1.2, 1.6, 2.0]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
