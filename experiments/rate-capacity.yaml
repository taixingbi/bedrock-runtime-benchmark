# The canonical "give me the production operating envelope" run: an
# open-loop Poisson RATE sweep straddling the model's own RPM quota --
# separates latency saturation (concurrency-sweep's job) from
# RPM/throttling saturation (this one's).
#
# Rates are quota_fractions of each workload's PROVIDER CEILING from
# the model's quota in catalog/models.yaml:
#   ceiling = min(RPM / 60, TPM / (input + max_tokens) / 60)
# (1.0 = exactly the ceiling; the artifact's provider_constraints says
# whether RPM or TPM binds). One sweep brackets every model's ceiling:
# 0.25x..2.5x is 0.21..2.08 rps for a 50 RPM model and 4.2..41.7 rps
# for a 1000 RPM one. The first batch showed real ceilings between
# ~1.0x and ~1.9x quota, so the sweep extends to 2.5x to find the edge.
name: rate-capacity
description: |
  Poisson rate sweep at 0.25x..2.5x of each model's provider ceiling,
  short_chat workload, 10s warmup + 90s window per point (~13 min per model).

workloads: [short_chat]

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: rate
  quota_fractions: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5]

# Production = min(statistically_confirmed x (1 - provider_headroom),
#                  provider_ceiling x (1 - quota_headroom)): passing above
# quota in a 90s window may be Bedrock burst allowance, not sustainable.
provider_headroom: 0.20
quota_headroom: 0.10

# Two phases with separate jobs (analysis/confirmation.py):
#   discovery     every value once -- picks the candidate and reports the
#                 transition region; its data never confirms anything.
#   confirmation  fresh repetitions at the candidate (the highest
#                 non-failing point at or below the provider ceiling)
#                 until a pre-planned look PASSes it, an observed
#                 violation FAILs it, or a cap is hit -> INCONCLUSIVE.
# PASS only at max_looks pre-planned sample sizes, each at confidence
# 1 - 0.05 / max_looks, so repeated checking can't inflate false PASSes.
# For gold (throttle <= 0.1%, exact Clopper-Pearson bounds) with
# max_looks 2 the looks are at 3,688 and 5,570 requests; at the 6.67 rps
# ceiling (~600 requests/rep) that's 7 and 10 repetitions, inside the
# caps below.
confirmation:
  max_looks: 2
  max_repetitions: 10
  max_requests: 8000
  max_duration_s: 1800
  candidates: 1

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
