# Per-class ISOLATED concurrency envelope for the three reference
# workloads (one per SLO tier). Closed-loop: N workers, each firing its
# next request as soon as the previous one returns. Runs against every
# model in catalog/models.yaml -- this file never names a model.
#
# Each class is swept ALONE, so its max_inflight is the safe in-flight
# count when only that class is running (scope: isolated_workload_class).
# The three values are NOT additive and are not a global limit -- a
# mixed-traffic total would need its own mixed experiment.
#
# Concurrency is absolute (not quota-relative): it's a property of the
# caller, not the quota. By Little's law the quota ceiling (6.67 rps on
# nova-micro) is reached at C ~= ceiling x latency: ~4 for short_chat
# (~0.56 s), ~14 for rag_answer (~2 s), ~43 for long_generation (~6.5 s)
# -- so one list spans 1..48, and stop_after_fails ends each class's
# discovery at its first clear failure instead of sweeping a
# throttle storm. For a low-quota model even C=1 can exceed quota --
# that's a real result, and capacity-reference-rate.yaml resolves such a model.
#
# transport.total_max_attempts=1: the SDK must never retry, or a real
# Bedrock 429 would be absorbed into an eventual 200 and the measured
# throttle rate understated (see client.py's TransportConfig).
purpose: reference
name: capacity-reference-concurrency
description: |
  The three reference workloads (short_chat gold, rag_answer silver,
  long_generation bronze), each swept alone at concurrency 1..48 until
  a clear FAIL, 10s warmup + 120s window per discovery point, plus
  adaptive confirmation with continuous windows of at least 300s.
  Answers: each class's isolated max_inflight and its saturation edge.

workloads: [short_chat, rag_answer, long_generation]

# warmup_s runs load before the measurement window opens and is never
# counted; in-flight requests at window close drain and are recorded,
# but only in-window completions count toward throughput/goodput.
warmup_s: 10
duration_s: 120
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8, 12, 16, 24, 32, 48]
  stop_after_fails: 1
  stop_after_clear_fail: true
  # Coarse grid -> non-FAIL / FAIL bracket -> integer bisection ->
  # fresh confirmation. 8 non-FAIL / 12 FAIL tests 10, then 11 or 9: the
  # candidate becomes the real edge (say 11 -> max_inflight 8) instead of
  # the grid point below it (8 -> 6). Discovery-class data: it only picks
  # candidates. max_points 4 resolves the widest gap (32 -> 48).
  refinement:
    strategy: integer_bisection
    stop_when_adjacent: true
    max_points: 4
    cooldown_s: 120      # recovery interval before EACH refinement point

# Provider-state isolation: the three classes share one model's quota, so
# a fixed recovery interval follows each class's overload to reduce
# carry-over -- approximating C_safe(W_i), not C_safe(W_i | history).
# confirmation.cooldown_s below inserts the same interval before EVERY
# candidate, including a lower one after a higher one FAILed.
isolation:
  inter_subject_cooldown_s: 120
  # Recovery is CHECKED, not assumed: after each recovery interval a short
  # low-load probe (data discarded) must be healthy -- no throttling,
  # >= 90% success, TTFT p50 within 2x the first healthy probe -- before
  # the next phase; unhealthy -> wait retry_cooldown_s and probe again, up
  # to max_attempts; never healthy -> measurement_validity: invalid.
  # Points throttled far below the ceiling are discarded, recovered and
  # re-measured once (provider state, not the point's own load).
  recovery_probe:
    baseline_fraction: 0.25
    baseline_duration_s: 120
    baseline_min_requests: 100
    baseline_goodput_ratio: 0.9
    duration_s: 20
    concurrency: 1
    max_throttle_rate: 0.0
    min_success_rate: 0.9
    max_ttft_ratio: 2.0
    max_attempts: 5
    retry_cooldown_s: 120

# The whole experiment, per class:
#
#   coarse concurrency sweep          fixed-duration windows (warmup_s / duration_s above)
#           |
#   first clear FAIL             stop_after_fails
#           |
#   integer bisection refinement      refinement -- still discovery-class data
#           |
#   top 2 non-failing candidates      candidates, tested HIGHEST first, alpha split over both
#           |
#   fresh fixed-count confirmation    new data only; looks at pre-planned N
#           |
#   statistically confirmed max concurrency     (the capacity)
#           |
#   headroom                          constraints/recommendation-policy.yaml
#           |
#   recommended max_inflight          floor(confirmed x (1 - headroom))
#
# Confirmation is SAMPLE-COUNT driven. The code plans the looks before
# any confirmation data exists -- with 2 candidates (alpha split over
# both, tested highest first, stop at the first PASS) gold: N1 = 4,380,
# N2 = 6,379 requests (silver 875 / 1,274, bronze 437 / 636) -- and look
# j is decided on EXACTLY the first N_j requests, even if the window that
# crossed N_j ran on further. Repetitions are only how requests are
# collected, so there is no repetition cap; the caps are:
#   max_requests    per candidate
#   max_duration_s  the whole phase for one class -- fits the higher gold
#                   candidate FAILing and the lower one confirming (e.g.
#                   C=2 at ~3.5 rps: ~1,430 s to reach 4,380)
# Reaching a cap without a PASS is INCONCLUSIVE, never a looser SLO.
# cooldown_s runs before each tested candidate (not counted against
# max_duration_s), so none inherits the overload that ran before it.
confirmation:
  min_steady_state_duration_s: 300
  continuous: true
  max_looks: 2
  max_requests: 8000
  max_duration_s: 3000
  candidates: 2
  cooldown_s: 120

# No throttle_pause_s: this is the canonical capacity benchmark, so it
# measures pure closed-loop concurrency -- a worker re-fires as soon as
# any response (429 included) returns. Client backoff after a 429 would
# lower the offered load and flatter the throttle rate that
# max_inflight is derived from; study backoff in its own experiment.

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
