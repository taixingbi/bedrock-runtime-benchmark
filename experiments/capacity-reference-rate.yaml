# Single-run sustainable capacity; temporal validation is required for production.
purpose: reference
name: capacity-reference-rate
description: |
  Open-loop Poisson discovery up to the nominal provider ceiling, stopping
  after a clear FAIL. Recovery is checked at both liveness and baseline load.
  Fresh confirmation tries lower candidates if necessary, with at least
  300 seconds of continuous measured load per window.
workloads: [short_chat, rag_answer, long_generation]
warmup_s: 10
duration_s: 90
stream: true
sweep:
  type: rate
  # Add 1.25 explicitly when a boundary probe is required.
  quota_fractions: [0.25, 0.5, 0.75, 1.0]
  stop_after_clear_fail: true
confirmation:
  max_looks: 2
  max_requests: auto
  max_duration_s: auto
  candidates: 3
  cooldown_s: 120
  warmup_s: 60
  min_steady_state_duration_s: 300
  continuous: true
isolation:
  inter_subject_cooldown_s: 120
  recovery_probe:
    duration_s: 20
    concurrency: 1
    max_throttle_rate: 0.0
    min_success_rate: 0.99
    max_ttft_ratio: 2.0
    max_attempts: 5
    retry_cooldown_s: 120
    baseline_fraction: 0.25
    baseline_duration_s: 120
    baseline_min_requests: 100
    baseline_goodput_ratio: 0.9
transport:
  max_connections: 128
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
