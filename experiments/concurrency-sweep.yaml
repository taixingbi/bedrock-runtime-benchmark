# Core experiment #1: how does throughput/TTFT/error rate change as
# concurrency increases, for one workload shape? Talks to Bedrock
# directly -- no gateway, no admission control, see this repo's own
# README on why that boundary matters.
#
# quota_snapshot below is documented context (queried from AWS Service
# Quotas, same values gateway-model-quotas-dev holds), NOT enforced by
# this tool -- it only ever measures what actually happens.
#
# transport is explicit and recorded into the resulting
# capacity-profile.yaml for reproducibility -- total_max_attempts=1
# specifically, since the SDK's own automatic retry would silently
# absorb a real Bedrock 429 into an eventual 200, understating the
# real throttle rate this sweep exists to measure (see client.py's
# TransportConfig docstring).
name: nova-micro-concurrency-sweep
description: |
  Fixed "short" workload (512 input / 64 output tokens), swept across
  concurrency 1/2/4/6/8, 120s per point (~10 minutes total). Answers:
  what's the recommended concurrency for this workload shape under the
  configured SLO, and where's the saturation edge?

target:
  model_id: us.amazon.nova-micro-v1:0
  region: us-east-1

quota_snapshot:
  rpm: 400
  tpm: 8000000

slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

workloads:
  - name: short
    input_tokens: 512
    output_tokens: 64

# warmup_s runs load before the measurement window opens and is never
# counted; in-flight requests at window close drain and are recorded,
# but only in-window completions count toward throughput/goodput.
warmup_s: 10
duration_s: 120
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
