# How do throughput / TTFT / throttling change as concurrency rises, for
# one workload shape? Closed-loop: N workers, each firing its next
# request as soon as the previous one returns. Runs against every model
# in catalog/models.yaml -- this file never names a model.
#
# Concurrency is absolute (not quota-relative): it's a property of the
# caller, not the quota. For a low-quota model (e.g. 50 RPM) even C=1
# can already exceed quota -- that's a real result (no recommendation),
# and rate-capacity.yaml is the sweep that resolves such a model.
#
# transport.total_max_attempts=1: the SDK must never retry, or a real
# Bedrock 429 would be absorbed into an eventual 200 and the measured
# throttle rate understated (see client.py's TransportConfig).
# reference: produces short_chat's production max_inflight envelope.
purpose: reference
name: concurrency-sweep
description: |
  short_chat workload (512 input / 64 output tokens), concurrency
  1/2/4/6/8, 10s warmup + 120s window per point, plus adaptive
  confirmation at the candidate.
  Answers: the recommended concurrency for this shape under its SLO
  profile, and where the saturation edge is.

workloads: [short_chat]

# warmup_s runs load before the measurement window opens and is never
# counted; in-flight requests at window close drain and are recorded,
# but only in-window completions count toward throughput/goodput.
warmup_s: 10
duration_s: 120
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8]


# Discovery (above) picks the candidate; confirmation collects FRESH
# repetitions there -- the only source of statistically_confirmed (see
# docs/slo-statistics.md). One 120s window resolves nothing for gold: C=4
# on nova-micro gave 796 requests, 0 throttles -- a 0.38% upper bound,
# INCONCLUSIVE against 0.1% (needs 2,995). Gold's looks are at 3,688 and
# 5,570 requests: ~5 and 7 repetitions at the 6.67 rps ceiling. Caps end
# in INCONCLUSIVE, never a looser SLO.
#
# candidates: 2 -- the two highest non-failing concurrencies (e.g. C=2
# and C=4 when C=6 FAILs), tested lowest-first (fixed sequence -- keep
# this order; don't skip to the higher one to save time): C=4 is tried
# only if C=2 confirms, so a FAIL at C=4 still leaves C=2 confirmed.
# cooldown_s lets the saturation point's overload clear first.
#
# Budget for BOTH candidates (gold, 120s window + 10s warmup per rep):
#   C=2  ~388 req/rep -> 3,688 at the first look = 10 reps  ~1,300s
#   C=4  ~796 req/rep -> 3,688 = 5 reps (5,570 = 7 after a stray event) ~650-910s
# = ~1,950-2,210s: 1,800 left C=4 INCONCLUSIVE (max_duration) every
# time. 3,000s resolves both; max_repetitions 12 keeps C=2 reachable
# when a rep comes in under 369 requests. More SAMPLES, same SLO.
confirmation:
  max_looks: 2
  max_repetitions: 12
  max_requests: 8000
  max_duration_s: 3000
  candidates: 2
  cooldown_s: 120

# No throttle_pause_s: this is the canonical capacity benchmark, so it
# measures pure closed-loop concurrency -- a worker re-fires as soon as
# any response (429 included) returns. Client backoff after a 429 would
# lower the offered load and flatter the throttle rate that
# max_inflight is derived from; study backoff in its own experiment.

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
