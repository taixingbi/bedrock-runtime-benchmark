# llama3-3-70b's real quota (80 RPM = 1.33 rps, 600,000 TPM) is the
# tightest TPM budget of any certified model relative to its RPM --
# worth watching whether TPM or RPM saturates first here, unlike
# nova-pro/nova-micro where RPM saturates well before TPM ever could.
#
# Live-checked (scripts/fetch_quota.py --model-id us.meta.llama3-3-70b-instruct-v1:0):
#   80 RPM = 1.33 rps, 600,000 TPM
# Live-measured (a 1-request smoke check at concurrency=1, closed-loop):
#   TTFT ~303ms, e2e latency ~759ms -> closed-loop rate at just C=1 is
#   already ~1.32 rps -- almost EXACTLY at the real RPM ceiling. Same
#   reasoning as nova-pro-rate-capacity.yaml: a concurrency sweep can't
#   resolve this model's safe zone, a fractional-rps rate sweep can.
name: llama3-70b-rate-capacity
description: |
  Rate sweep bracketing the real ~1.33 rps RPM ceiling with fractional
  values below 1. Also worth reading token_throughput_tps against the
  600,000 TPM (=10,000 tokens/sec) budget directly -- at this model's
  quota, a heavier workload (larger max_tokens) could plausibly hit
  TPM saturation before RPM does, unlike this repo's other rate-sweep
  experiments. 120s per point (8 points ~= 16 minutes total).

target:
  model_id: us.meta.llama3-3-70b-instruct-v1:0
  region: us-east-1

quota_snapshot:
  rpm: 80
  tpm: 600000

slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

workloads:
  - name: short
    input_tokens: 512
    output_tokens: 64

duration_s: 120
stream: true

sweep:
  type: rate
  values: [0.4, 0.6, 0.8, 1.0, 1.33, 1.6, 2.0, 3.0]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
