# Mixed-workload capacity. Isolated per-class sweeps (token-sweep.yaml)
# can't be combined into one cross-class number -- a real mix of short
# and long traffic can exceed safe capacity before either class's own
# isolated measurement would predict. This sweeps ONE offered rate where
# every arrival independently draws its class by weight, and a point
# passes only if the SLO holds for EACH class, not just the blend.
#
# Rates are quota_fractions of the mix's provider ceiling --
# min(RPM, TPM / avg tokens per request), see rate-capacity.yaml.
# Each class is judged against its own SLO profile. The mixed_workloads envelope is valid for THIS
# mix's shares only -- a different traffic mix needs its own run.
name: mixed-capacity
description: |
  Poisson rate sweep at 0.25x..2.5x of the model's provider ceiling,
  70% short (512/64) + 30% long_long (4096/512), 10s warmup + 90s
  window per point (~13 min per model).

# Default SLO (interactive). long_long opts into long_generation:
# a 512-token reply can't be held to the same end-to-end budget as a
# 64-token one -- TTFT stays the same, E2E latency doesn't.
slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

slo_profiles:
  long_generation:
    ttft_p95_ms: 1000
    latency_p95_ms: 10000
    success_rate_min: 0.99
    throttle_rate_max: 0.001

workloads:
  - name: short
    input_tokens: 512
    output_tokens: 64
  - name: long_long
    input_tokens: 4096
    output_tokens: 512
    slo_profile: long_generation

mix:
  name: short70_long30
  weights:
    short: 0.7
    long_long: 0.3

warmup_s: 10
duration_s: 90
stream: true
seed: 7

sweep:
  type: rate
  quota_fractions: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
