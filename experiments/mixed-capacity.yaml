# Mixed-workload capacity. Isolated per-class sweeps (token-sweep.yaml)
# can't be combined into one cross-class number -- a real mix of short
# and long traffic can exceed safe capacity before either class's own
# isolated measurement would predict. This sweeps ONE offered rate where
# every arrival independently draws its class by weight, and a point
# passes only if the SLO holds for EACH class, not just the blend.
#
# Rates are quota_fractions of the mix's provider ceiling --
# min(RPM, TPM / avg tokens per request), see rate-capacity.yaml.
# Each class is judged against its own SLO profile (bound in
# catalog/workloads.yaml) -- a real mix of request classes on one model. The mixed_workloads
# envelope is valid for THIS mix's shares only -- a different traffic
# mix needs its own run.
name: mixed-capacity
description: |
  Poisson rate sweep at 0.25x..2.5x of the model's provider ceiling,
  60% short_chat + 30% rag_answer + 10% long_generation, 10s warmup +
  90s window per point, plus adaptive confirmation at the candidate.

workloads: [short_chat, rag_answer, long_generation]

mix:
  name: chat60_rag30_gen10
  weights:
    short_chat: 0.6
    rag_answer: 0.3
    long_generation: 0.1

warmup_s: 10
duration_s: 90
stream: true
seed: 7

sweep:
  type: rate
  quota_fractions: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5]

provider_headroom: 0.20
quota_headroom: 0.10

# Confirmation at the mix's candidate (fresh data -- see
# docs/slo-statistics.md). Every class is gated on its own profile but
# sees only its share of the requests: short_chat (gold, 60%) needs its
# 3,688 at the first look, so the mix needs 6,147 -- 11 repetitions at
# the ~6.67 rps ceiling (600 requests each), and 9,284 (16) for the
# second look. Hence caps above rate-capacity's: more SAMPLES, never a
# looser SLO.
confirmation:
  max_looks: 2
  max_repetitions: 16
  max_requests: 10000
  max_duration_s: 1800
  candidates: 1

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
