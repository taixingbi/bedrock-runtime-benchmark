# Mixed-workload rate calibration. Isolated workload envelopes from
# rate-capacity and calibration points from workload-shape-calibration cannot be
# combined mathematically into one global cross-class rate -- a real mix
# of short and long traffic can exceed safe capacity before any class's
# isolated measurement would predict.
#
# This experiment measures the statistically confirmed SLO-qualified
# total offered rate for ONE explicit workload mix -- R_safe(mix).
# Recommendation policy then applies headroom to produce the mix-scoped
# R_admission(mix) for a gateway's mix-scoped total-rate admission
# guardrail:
#
#   statistically confirmed R_safe(mix)      (measurement: rate block)
#           |
#   recommendation headroom                  (constraints/recommendation-policy.yaml)
#           |
#   R_admission(mix)                         (recommendation.admission_envelope.sustained_rps)
#
# R_safe itself is not gateway config. And this experiment does NOT
# validate that gateway policy: requests go directly to Bedrock.
# End-to-end validation belongs to eval-bedrock-platform.
#
# One sweep of the total offered rate; arrivals use the configured
# class assignment, and a point PASSes only if EACH class meets its
# own SLO profile (catalog/workloads.yaml) -- the blend is reported,
# never gated. Rates are quota_fractions of the mix's provider ceiling --
# min(RPM, TPM / avg tokens per request), see rate-capacity.yaml.
#
#   actual workflow traffic mix  (catalog/mixes.yaml)
#           |
#   mixed-capacity: every class individually meets its own SLO
#           |
#   R_safe(mix) -> headroom -> R_admission(mix)
#
# Valid for THIS mix only: there is no single R_safe. Each workflow is its
# own mix, measured on its own --
#   chat-heavy -> R_safe(chat-heavy), RAG-heavy -> R_safe(rag-heavy),
#   generation-heavy -> R_safe(generation-heavy)
# -- with weights taken from that workflow's real traffic
# (`source: production_traffic_profile` in catalog/mixes.yaml):
#   bedrock-benchmark run mixed-capacity --model <model> --mix <workflow mix>
# The default, 60/30/10, is a REFERENCE EXAMPLE kept fixed for comparing
# runs over time -- never a global production assumption. Never add up
# isolated per-class capacities instead.
# reference: produces the admission envelope (scope: workload_mix) for
# this mix of reference workloads.
purpose: reference
name: mixed-capacity
description: |
  Mixed-workload rate calibration: Poisson rate sweep at 0.25x..2.5x of
  the provider ceiling for ONE mix from catalog/mixes.yaml (default: the
  60/30/10 reference example; --mix for a real workflow's mix), 10s
  warmup + 90s window per point, plus adaptive confirmation. Produces
  R_safe(mix) -- backend evidence for a gateway's mix-scoped rate
  guardrail, not a validation of gateway policy.

# The workloads are the mix's classes (catalog/mixes.yaml).
mix:
  name: chat60_rag30_gen10
  # stratified: arrivals stay Poisson in time, but classes are assigned in
  # shuffled blocks with exactly the configured counts (6/3/1), with at most one partial block per repetition.
  # stochastic (independent draws) instead models production-like
  # randomness, at the cost of the realized mix drifting by sampling
  # noise. The profile records configured_mix and observed_mix either way.
  assignment: stratified

warmup_s: 10
duration_s: 90
stream: true
seed: 7

sweep:
  type: rate
  quota_fractions: [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0, 2.5]


# Confirmation at the mix's candidate (fresh data -- see
# docs/slo-statistics.md). Every class is gated on its own profile but
# sees only its share of the requests: a look is taken when each class
# has its OWN count (short_chat 3,688, rag_answer 736, long_generation
# 368 for look 1). At 60% short_chat that's ~6,150 mix requests (~9,300
# for look 2) -- more SAMPLES, never a looser SLO.
# Caps are `auto`: the last look's sample size x 1.25, and the time THAT
# candidate needs to collect it at its own request rate x 1.25. A fixed
# 1800 s fits ~9,300 requests only at >= ~5 rps; on a low-RPM model it
# would make every candidate INCONCLUSIVE by construction. `plan` shows
# the resulting estimate.
# The sweep ENDS at 2.5x the ceiling: cooldown_s inserts a recovery interval before the
# candidate and warmup_s conditions it (data discarded), so the looks read
# steady state -- not a drained bucket, nor a rested one's burst credit.
confirmation:
  max_looks: 2
  max_requests: auto
  max_duration_s: auto
  candidates: 1
  cooldown_s: 120
  warmup_s: 60

# Provider-state isolation (one subject, so no inter-subject interval).
isolation:
  # Recovery is CHECKED, not assumed: after each recovery interval a short
  # low-load probe (data discarded) must be healthy -- no throttling,
  # >= 90% success, TTFT p50 within 2x the first healthy probe -- before
  # the next phase; unhealthy -> wait retry_cooldown_s and probe again, up
  # to max_attempts; never healthy -> measurement_validity: invalid.
  # Points throttled far below the ceiling are discarded, recovered and
  # re-measured once (provider state, not the point's own load).
  recovery_probe:
    duration_s: 20
    concurrency: 1
    max_throttle_rate: 0.0
    min_success_rate: 0.9
    max_ttft_ratio: 2.0
    max_attempts: 5
    retry_cooldown_s: 120

transport:
  # Same as rate-capacity: 2.5x the ceiling with long_generation's
  # minute-long streams in flight must not queue on the client pool.
  max_connections: 128
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
