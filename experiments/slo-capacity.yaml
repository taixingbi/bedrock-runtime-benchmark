# Core experiment #3: a RATE sweep (not concurrency) across and past
# the real provider RPM ceiling (400 RPM = ~6.67 rps for this model/
# region) -- this is what actually separates "latency saturation"
# (concurrency-sweep.yaml's job) from "RPM/throttling saturation"
# (this one's job). This is the canonical "give me the production
# operating envelope" run -- its capacity-profile.yaml output is what
# a gateway's control-plane config review should actually read.
name: nova-micro-slo-capacity
description: |
  Poisson rate sweep 1..8 rps (straddling the real ~6.67 rps RPM
  ceiling), 90s per point (~12 minutes total), "short" workload.
  Where offered load first crosses into real Bedrock throttling is the
  provider_headroom-adjusted sustainable_rps this repo's whole
  recommendation exists to answer.

target:
  model_id: us.amazon.nova-micro-v1:0
  region: us-east-1

quota_snapshot:
  rpm: 400
  tpm: 8000000

slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

workloads:
  - name: short
    input_tokens: 512
    output_tokens: 64

duration_s: 90
stream: true

sweep:
  type: rate
  values: [1, 2, 3, 4, 5, 6, 7, 8]

provider_headroom: 0.20

transport:
  max_connections: 64
  retry_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
