# Experiment B template: generate runnable configs from Experiment A results with
# scripts/prepare_context_history.py. No example R_safe values are used as data.
# Each arm starts with idle; fixed waits do not prove a provider reset.
purpose: characterization
name: diagnostic-context-history
description: |
  Compare 512/64, 2048/64, and 8192/64 input classes at 50%, 75%, and 90%
  of their independently confirmed idle baseline rates. Continuous 900s
  observations, 30s descriptive bins, paired seeds and reversed arm order.
  Recovery observations do not independently confirm post-overload capacity.
workloads: [short, medium, long]
baseline_required: true
warmup_s: 0
duration_s: 900
repetitions: 2
stream: true
seed: 7
sweep:
  type: rate
  baseline_fractions: [0.5, 0.75, 0.9]
history_protocol:
  idle_s: 300
  overload_quota_fraction: 2.0
  overload_duration_s: 120
  recovery_mode: fixed_wait
  # Preserve the first-round protocol; revisit shorter waits after completion.
  recovery_delays_s: [120, 300, 600]
  bin_s: 30
transport:
  max_connections: 128
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
