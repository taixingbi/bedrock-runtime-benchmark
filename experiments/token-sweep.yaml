# Does capacity depend on workload SHAPE, not just load? Each request
# class in the catalog (scripts/workloads.yaml) -- short chat, RAG
# answer, long generation -- concurrency-swept on its own. One result
# per class is the evidence for per-request-class concurrency config; a
# single shape doesn't generalize to every class.
#
# Each workload is judged against the SLO profile the catalog binds it to.
#
# Slow: 3 workloads x 4 points x (10s warmup + 90s window) ~= 20 min per
# model. Run it for a capacity re-baseline, not on every change.
name: token-sweep
description: |
  Concurrency 1/2/4/6 repeated across the catalog's three request
  classes (short_chat / rag_answer / long_generation). One
  capacity-profile entry per workload.

workloads: [short_chat, rag_answer, long_generation]

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
