# Does capacity depend on workload SHAPE, not just load? The 2x2
# input/output grid -- short-short, output-heavy, input-heavy,
# long-long -- each concurrency-swept. One result per shape is the
# evidence for per-tenant-class concurrency config; a single shape
# doesn't generalize to every class.
#
# Slow: 4 workloads x 4 points x (10s warmup + 90s window) ~= 27 min per
# model. Run it for a capacity re-baseline, not on every change.
name: token-sweep
description: |
  Concurrency 1/2/4/6 repeated across 4 input/output token shapes.
  One capacity-profile entry per shape.

# Default SLO (interactive). Long generations opt into long_generation:
# a 512-token reply can't be held to the same end-to-end budget as a
# 64-token one -- TTFT stays the same, E2E latency doesn't.
slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

slo_profiles:
  long_generation:
    ttft_p95_ms: 1000
    latency_p95_ms: 10000
    success_rate_min: 0.99
    throttle_rate_max: 0.001

workloads:
  - name: short_short
    input_tokens: 512
    output_tokens: 64
  - name: short_output_heavy
    input_tokens: 512
    output_tokens: 512
    slo_profile: long_generation
  - name: long_input_short_output
    input_tokens: 4096
    output_tokens: 64
  - name: long_long
    input_tokens: 4096
    output_tokens: 512
    slo_profile: long_generation

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
