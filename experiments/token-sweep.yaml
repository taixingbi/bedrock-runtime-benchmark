# Does capacity depend on workload SHAPE, not just load? The 2x2
# input/output grid -- short-short, output-heavy, input-heavy,
# long-long -- each concurrency-swept. One result per shape is the
# evidence for per-tenant-class concurrency config; a single shape
# doesn't generalize to every class.
#
# SLO tiers (constraints/slo.yaml) are named per workload by request
# class: short chat -> tier1_interactive, long-context short answer
# (RAG-like) -> tier2_standard, 512-token generations -> tier3_throughput.
#
# Slow: 4 workloads x 4 points x (10s warmup + 90s window) ~= 27 min per
# model. Run it for a capacity re-baseline, not on every change.
name: token-sweep
description: |
  Concurrency 1/2/4/6 repeated across 4 input/output token shapes.
  One capacity-profile entry per shape.

workloads:
  - name: short_short
    input_tokens: 512
    output_tokens: 64
    slo_profile: tier1_interactive
  - name: short_output_heavy
    input_tokens: 512
    output_tokens: 512
    slo_profile: tier3_throughput
  - name: long_input_short_output
    input_tokens: 4096
    output_tokens: 64
    slo_profile: tier2_standard
  - name: long_long
    input_tokens: 4096
    output_tokens: 512
    slo_profile: tier3_throughput

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
