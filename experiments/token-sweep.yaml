# Core experiment #2: does capacity depend on workload SHAPE, not just
# rate? The 2x2 input/output grid this repo's README describes --
# short-short, output-heavy, input-heavy, long-long. A single
# concurrency-sweep.yaml result for one shape does NOT generalize to
# every tenant-class in a real gateway; this is what tells you it
# doesn't.
#
# Deliberately long-running: 4 workloads x 4 concurrency values x 90s
# = 24 minutes. Run this occasionally (a real capacity re-baseline),
# not on every change -- concurrency-sweep.yaml is the fast one.
name: nova-micro-token-sweep
description: |
  Same concurrency sweep (1/2/4/6), repeated across 4 input/output
  token shapes. Produces one capacity-profile.yaml entry per shape --
  the actual evidence for a gateway's per-tenant-class concurrency
  config, not one number applied uniformly to every workload.

target:
  model_id: us.amazon.nova-micro-v1:0
  region: us-east-1

quota_snapshot:
  rpm: 400
  tpm: 8000000

slo:
  ttft_p95_ms: 1000
  latency_p95_ms: 3000
  success_rate_min: 0.99
  throttle_rate_max: 0.001

workloads:
  - name: short_short
    input_tokens: 512
    output_tokens: 64
  - name: short_output_heavy
    input_tokens: 512
    output_tokens: 512
  - name: long_input_short_output
    input_tokens: 4096
    output_tokens: 64
  - name: long_long
    input_tokens: 4096
    output_tokens: 512

duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6]

provider_headroom: 0.20

transport:
  max_connections: 64
  retry_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
