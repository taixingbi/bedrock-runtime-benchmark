# Does capacity depend on workload SHAPE, not just load? The four most
# distinct shapes in the catalog (catalog/workloads.yaml), each
# concurrency-swept on its own:
#   short_chat                 512 / 64    short baseline
#   long_context_short_answer  8192 / 64   input-side (prefill) pressure
#   rag_answer                 4096 / 256  the common mixed case
#   long_generation            4096 / 1024 output-side (decode) pressure
# One result per class is the evidence for per-request-class concurrency
# config; a single shape doesn't generalize to every class. The rest of
# the catalog (tiny_request, medium_context, very_large_context) is for
# targeted runs, not this default sweep.
#
# Each workload is judged against the SLO profile the catalog binds it to.
#
# Slow: 4 workloads x 4 points x (10s warmup + 90s window) ~= 27 min per
# model. Run it for a capacity re-baseline, not on every change.
name: token-sweep
description: |
  Concurrency 1/2/4/6 across the four most distinct catalog shapes
  (short chat, long-context short answer, RAG answer, long generation).
  One capacity-profile entry per workload.

workloads: [short_chat, long_context_short_answer, rag_answer, long_generation]

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6]

provider_headroom: 0.20

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
