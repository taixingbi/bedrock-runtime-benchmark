# Does capacity depend on workload SHAPE, not just load? The four
# CHARACTERIZATION workloads of the catalog (catalog/workloads.yaml),
# each concurrency-swept on its own:
#   tiny_request               256 / 32     low-token latency floor
#   medium_context             2048 / 128   common app traffic
#   long_context_short_answer  8192 / 64    input-side (prefill) pressure
#   very_large_context         16384 / 256  large prefill
# The reference workloads (short_chat, rag_answer, long_generation) are
# NOT repeated here: their production concurrency comes from
# concurrency-sweep. This experiment only characterizes how token /
# context shape moves the envelope.
#
# Each workload is judged against the SLO profile the catalog binds it
# to. The quota ceiling is reached at very different concurrency per
# shape (~2 for tiny_request up to ~17 for very_large_context on
# nova-micro), so one list spans 1..24 and stop_after_fails ends each
# workload two points past its saturation.
#
# Slow: run it for a capacity re-baseline, not on every change.
# characterization: how token shape / context size move the envelope.
# Measured and confirmed, but it never produces an admission-envelope
# recommendation -- production envelopes come from reference experiments.
purpose: characterization
name: token-sweep
description: |
  Concurrency 1..24 (until two consecutive FAILs) across the four
  characterization shapes (tiny request, medium context, long-context
  short answer, very large context). One capacity-profile entry per
  workload, never a recommendation.

workloads: [tiny_request, medium_context, long_context_short_answer, very_large_context]

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8, 12, 16, 24]
  stop_after_fails: 2


# Confirmation at each workload's candidate (fresh data, never pooled
# with discovery -- see docs/slo-statistics.md). First look per profile:
# gold 3,688 requests, silver 736, bronze 368 -- a few 90s repetitions
# each at the concurrencies this sweep reaches.
confirmation:
  max_looks: 2
  max_repetitions: 10
  max_requests: 8000
  max_duration_s: 1800
  candidates: 1

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
