# Admission calibration: the statistically confirmed safe concurrency of
# each workload SHAPE under its real business SLO, the quota and the
# measured provider environment --
#   C_safe = f(input/output tokens, SLO, quota, provider conditions)
# -- for the four catalog shapes that aren't reference workloads, each
# concurrency-swept on its own:
#   tiny_request               256 / 32     gold    low-token latency floor
#   medium_context             2048 / 128   silver  common app traffic
#   long_context_short_answer  8192 / 64    silver  input-side (prefill) pressure
#   very_large_context         16384 / 256  bronze  large prefill
# The reference workloads (short_chat, rag_answer, long_generation) are
# not repeated: their production envelopes come from concurrency-sweep
# and rate-capacity.
#
# Output per shape: a `calibration_point` (confirmed concurrency,
# achieved_rps, goodput, saturation, bottleneck). achieved_rps is what
# C and latency produced in this closed-loop run -- an observation, not a
# tested rate envelope (that's rate-capacity's sustained_rps). A gateway
# derives its admission classes / weights from these points:
#
#   concurrency-sweep -> 3 reference production points  ┐
#   token-sweep       -> additional shape calibration   ┘
#          -> gateway derives a workload-aware admission policy
#          -> bedrock-platform-eval validates the DEPLOYED policy
#
# It is NOT a production config: no admission envelope, no headroom.
# Calibration points are isolated-workload measurements; per-shape
# C_safe values don't combine mathematically into a global policy. Any
# admission classes or weights derived from them must be validated under
# representative mixed traffic through the deployed gateway
# (bedrock-platform-eval) before production use -- this repo calls
# Bedrock directly and never validates gateway policy.
#
# Each shape keeps its own business SLO (catalog/workloads.yaml) -- the
# gateway needs C_safe under the SLO it will actually enforce, not a
# shape-only comparison under one fixed SLO.
#
# The quota ceiling is reached at very different concurrency per shape
# (~2 for tiny_request, long_generation needed C=32 in concurrency-sweep),
# so the list spans 1..48 like concurrency-sweep; stop_after_fails ends
# each shape two points past its saturation and refinement bisects the
# bracket. Slow: run it for a capacity re-baseline, not on every change.
purpose: admission_calibration
name: token-sweep
description: |
  Concurrency 1..48 (until two consecutive FAILs, then integer
  refinement and fixed-count confirmation) across the four non-reference
  catalog shapes, each under its own SLO. Produces statistically
  confirmed workload-shape capacity points used to calibrate gateway
  admission classes or weights -- not a production config.

workloads: [tiny_request, medium_context, long_context_short_answer, very_large_context]

warmup_s: 10
duration_s: 90
stream: true

sweep:
  type: concurrency
  values: [1, 2, 4, 6, 8, 12, 16, 24, 32, 48]
  stop_after_fails: 2
  refinement:            # bisect the bracket around saturation (see concurrency-sweep.yaml)
    strategy: integer_bisection
    stop_when_adjacent: true
    max_points: 4


# Confirmation at each workload's candidate (fresh data, never pooled
# with discovery -- see docs/slo-statistics.md). Looks at fixed sample
# sizes: gold N = 3,688 / 5,570, silver 736 / 1,113, bronze 368 / 555
# requests; stopped by max_requests / max_duration_s, never by a count
# of windows.
confirmation:
  max_looks: 2
  max_requests: 8000
  max_duration_s: 1800
  candidates: 1

transport:
  max_connections: 64
  total_max_attempts: 1
  connect_timeout_s: 5
  read_timeout_s: 60
