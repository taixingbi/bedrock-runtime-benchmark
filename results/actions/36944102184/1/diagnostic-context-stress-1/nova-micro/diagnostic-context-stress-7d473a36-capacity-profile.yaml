      no SLO gate
    throughput: successful completions inside window / window seconds; tokens from
      provider usage
    attempted_rps: SDK calls started inside window / window seconds
    reliability: all requests scheduled inside window, including drain outcomes
    outstanding: time-weighted mean and peak clipped to window; queue-inclusive and
