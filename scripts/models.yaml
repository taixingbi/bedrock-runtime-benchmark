# Models every experiment runs against (scripts/run.py, scripts/run_all.py).
# Experiments are model-agnostic; add a model here, not a new experiment.
#
#   name      short, filesystem-safe -- also the results folder name:
#             results/<batch>/<name>/
#   (quotas live in constraints/quota.yaml, keyed by `name`; SLOs in
#    constraints/slo.yaml -- this file only says which models exist)
#   enabled   false = skipped by default (still runnable via --model NAME)
#   token_counting  how prompt padding is sized (default auto):
#             auto = Bedrock CountTokens if the model supports it, else a
#             Converse usage probe (maxTokens=1), else 4 chars/token.
#             Force one with count_tokens | converse_usage | estimate.
#             As of 2026-09-25 none of the five models below support
#             CountTokens ("The provided model doesn't support counting
#             tokens"), so auto resolves to converse_usage for all of them.
#
# The five models bedrock-runtime-gateway certifies (certified_models.yaml).

models:
  - name: nova-micro
    model_id: us.amazon.nova-micro-v1:0
    region: us-east-1

  - name: nova-lite
    model_id: us.amazon.nova-lite-v1:0
    region: us-east-1

  - name: nova-pro
    model_id: us.amazon.nova-pro-v1:0
    region: us-east-1

  - name: llama3-3-70b
    model_id: us.meta.llama3-3-70b-instruct-v1:0
    region: us-east-1

  - name: qwen3-32b
    model_id: qwen.qwen3-32b-v1:0
    region: us-east-1
