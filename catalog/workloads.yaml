# Workload catalog -- every request shape the benchmark sends, defined once.
# Experiments only list workloads by name (`workloads: [short_chat]`); SLO
# numbers live in constraints/slo.yaml. The catalog is broader than any one
# experiment: a workload here sends no traffic until an experiment lists it.
#
#   in / out   input_tokens (padding calibrated to it) / output_tokens (max_tokens)
#   slo        profile from constraints/slo.yaml: TTFT / TPOT / success / throttle
#   e2e        latency_p95_ms -- end-to-end cap for THIS workload (business-defined;
#              different output lengths can't share one E2E budget)

workloads:
  # name                       in      out   slo     e2e ms      typical use -- purpose
  tiny_request:              {input_tokens: 256,   output_tokens: 32,   slo_profile: gold,   latency_p95_ms: 2000}   # intent/routing/tool selection -- low-token latency floor
  short_chat:                {input_tokens: 512,   output_tokens: 64,   slo_profile: gold,   latency_p95_ms: 3000}   # chatbot/copilot/short Q&A -- interactive baseline
  medium_context:            {input_tokens: 2048,  output_tokens: 128,  slo_profile: silver, latency_p95_ms: 6000}   # small RAG/doc Q&A/ticket summary -- common app traffic
  long_context_short_answer: {input_tokens: 8192,  output_tokens: 64,   slo_profile: silver, latency_p95_ms: 8000}   # long-doc/contract lookup -- prefill pressure (TPM-bound on llama3-3-70b)
  rag_answer:                {input_tokens: 4096,  output_tokens: 256,  slo_profile: silver, latency_p95_ms: 10000}  # knowledge assistant/support RAG -- context + medium answer
  long_generation:           {input_tokens: 4096,  output_tokens: 1024, slo_profile: bronze, latency_p95_ms: 60000}  # reports/code/drafts -- decode pressure, long occupancy
  very_large_context:        {input_tokens: 16384, output_tokens: 256,  slo_profile: bronze, latency_p95_ms: 20000}  # multi-doc/filing analysis -- large prefill (UNCONFIRMED placeholder values)
